
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LoRa Monitoring Dashboard</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:30px;
  font-family:Arial,sans-serif;
  background:#101827;color:#fff
}
h1{color:#38bdf8}
.container{max-width:950px;margin:auto}
.panel{
  background:#1e293b;padding:24px;
  border-radius:14px;margin:20px 0
}
input{
  width:100%;padding:12px;margin:8px 0 15px;
  border:1px solid #475569;border-radius:7px;
  background:#0f172a;color:white
}
button{
  background:#0284c7;color:white;
  padding:13px 22px;border:0;
  border-radius:7px;cursor:pointer
}
.cards{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:15px
}
.card{
  background:#334155;padding:20px;
  border-radius:10px
}
.value{font-size:25px;color:#38bdf8}
#result{line-height:2}
@media(max-width:600px){
 .cards{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="container">
<h1>LoRa Communication Monitoring</h1>
<p>Wireless Network Node Performance Dashboard</p>

<div class="panel">
<h2>Enter Node Details</h2>

<label>Node ID</label>
<input id="node" placeholder="LORA-01">

<label>RSSI (dBm)</label>
<input id="rssi" type="number" placeholder="-75">

<label>SNR (dB)</label>
<input id="snr" type="number" placeholder="10">

<label>Transmitted Packets</label>
<input id="sent" type="number" placeholder="100">

<label>Received Packets</label>
<input id="received" type="number" placeholder="98">

<button onclick="analyze()">Analyze Node</button>
</div>

<div class="panel">
<h2>Monitoring Results</h2>
<div class="cards">
<div class="card">
RSSI <div class="value" id="outRssi">--</div>
</div>
<div class="card">
SNR <div class="value" id="outSnr">--</div>
</div>
<div class="card">
PDR <div class="value" id="outPdr">--</div>
</div>
</div>
<h3 id="result">Waiting for input...</h3>
</div>
</div>

<script>
function analyze(){
 const node=document.getElementById("node").value.trim();
 const rssi=Number(document.getElementById("rssi").value);
 const snr=Number(document.getElementById("snr").value);
 const sent=Number(document.getElementById("sent").value);
 const received=Number(document.getElementById("received").value);

 if(!node || document.getElementById("rssi").value==="" ||
 document.getElementById("snr").value==="" ||
 document.getElementById("sent").value==="" ||
 document.getElementById("received").value==="" ||
 !Number.isFinite(rssi) || !Number.isFinite(snr) ||
 !Number.isInteger(sent) || !Number.isInteger(received) ||
 sent<=0 || received<0 || received>sent){
   alert("Please enter valid node and packet details!");
   return;
 }

 const lost=sent-received;
 const pdr=(received/sent)*100;

 let quality;
 if(rssi>=-90 && snr>=7 && pdr>=90)
   quality="GOOD";
 else if(rssi>=-110 && snr>=0 && pdr>=70)
   quality="MODERATE";
 else quality="POOR";

 const status=received>0?"ACTIVE":"INACTIVE";

 document.getElementById("outRssi").textContent=rssi+" dBm";
 document.getElementById("outSnr").textContent=snr+" dB";
 document.getElementById("outPdr").textContent=pdr.toFixed(2)+"%";

 document.getElementById("result").innerHTML=
 "Node ID: "+node+
 "<br>Transmitted: "+sent+
 "<br>Received: "+received+
 "<br>Packet Loss: "+lost+
 "<br>Communication: "+status+
 "<br>Link Quality: "+quality;
}
</script>
</body>
</html>
